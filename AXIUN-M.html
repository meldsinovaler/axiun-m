<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#d96a1b"><title>AXIUN M · Mercadería</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#282522;background:#fff8f2}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:880px;margin:auto;background:white;border:1px solid #f0dfd0;border-radius:22px;padding:18px;box-shadow:0 8px 30px #6a3b1710}header{background:#d96a1b;color:white;padding:19px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:26px}header p{margin:3px 0 0;font-size:12px}.tabs{display:flex;gap:5px;padding:5px;margin:14px 0 16px;border-radius:12px;background:#f7eee6}.tabs button{border:0;background:transparent;color:#5e5149;flex:1;padding:10px 3px;border-radius:10px;font-weight:650;cursor:pointer}.tabs button.active{background:white;box-shadow:0 2px 6px #00000014;color:#ba5412}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}h2{font-size:17px;margin:0}small,.hint{color:#76685f}.hint{font-size:12px;margin:8px 0}.tag{background:#f6e9dc;border-radius:999px;padding:5px 10px;font-size:12px;color:#9b460a;font-weight:700}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:480px}th,td{border-bottom:1px solid #f0ece8;text-align:left;padding:10px 7px}th{font-size:12px;color:#5d5048}td{font-size:14px}td:first-child{font-weight:600}input{font:inherit;outline-color:#dc873b;border:1px solid #e4d5c7;border-radius:7px;padding:8px;max-width:100%;background:white}td input{width:100%;min-width:55px}input[type=number]{appearance:textfield}.num{font-weight:700;font-variant-numeric:tabular-nums}.negative{color:#a51d21}.total{background:#f8f5f2;border-radius:12px;margin-top:16px;padding:16px}.total strong{display:block;font-size:29px;margin-top:4px}button.primary{background:#d96a1b;color:white;border:0;padding:11px 15px;border-radius:10px;font-weight:700;cursor:pointer}button.secondary{background:white;color:#ad5418;border:1px solid #e3b78f;padding:10px 12px;border-radius:10px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.form{display:grid;grid-template-columns:1fr 140px auto;gap:8px;margin-top:12px}.panel{border:1px solid #eadfd7;border-radius:12px;padding:15px;margin-top:12px}.error{color:#b12226}.empty{padding:20px;text-align:center;color:#76685f}.historyrow{display:flex;justify-content:space-between;gap:12px;padding:14px 3px;border-bottom:1px solid #eee}.historyrow span{color:#746356}footer{color:#796b61;font-size:12px;margin-top:16px;line-height:1.5}@media(max-width:550px){body{padding:8px}main{padding:12px;border-radius:15px}.form{grid-template-columns:1fr 110px}.form button{grid-column:1/-1}header{padding:14px}}
</style></head><body><main><header><div><h1>AXIUN M</h1><p>Control de mercadería</p></div><span aria-hidden="true" style="font-size:27px">▣</span></header><nav class="tabs" aria-label="Secciones"><button class="active" data-tab="hoy">Hoy</button><button data-tab="historial">Historial</button><button data-tab="productos">Productos</button></nav><section id="content"></section><footer>Versión local de prueba. Los registros se guardan en este navegador mediante almacenamiento local, no en Supabase. Exporta tus datos para tener una copia. El cálculo es estimado, no un reporte de ventas reales.</footer></main><script>
(function(){'use strict';
const KEY='axiun_m_v1';const defaults=[['Pecho',14,1],['Pierna',12,1],['Ala',10,1],['Hotdog',8,2],['Pechuga plancha',18,1],['Alitas acevichadas',20,1],['Hamburguesa de carne',5,1],['Hamburguesa de pollo',5,1]].map((x,i)=>({id:'p'+i,name:x[0],price:x[1],factor:x[2]}));
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'S/ '+Number(n).toFixed(2);
function dayKey(date=new Date()){let d=new Date(date.getTime()-2*60*60*1000);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function load(){try{const obj=JSON.parse(localStorage.getItem(KEY));if(obj&&Array.isArray(obj.products)&&obj.records&&typeof obj.records==='object')return obj}catch(e){}return{products:defaults,records:{}}}
let state=load(),tab='hoy';function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('No se pudieron guardar los datos. Exporta una copia y revisa el almacenamiento del navegador.');return false}}
function ensure(){const k=dayKey();if(!state.records[k]){state.records[k]={};save()}return state.records[k]}
const count=(p,r)=>{let a=Number(r?.initial??0),b=Number(r?.final??0);return (a-b)/p.factor};const totalFor=r=>state.products.reduce((s,p)=>s+Math.max(0,count(p,r[p.id]))*p.price,0);
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const c=$('#content');if(tab==='hoy'){
const r=ensure(),key=dayKey();c.innerHTML=`<div class="top"><h2>Registro diario</h2><span class="tag">${key} · HOY</span></div><div class="tablewrap"><table><thead><tr><th style="width:37%">Producto</th><th>Inicial</th><th>Final</th><th>Vendido</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.name)}</td><td><input aria-label="Inicial ${esc(p.name)}" type="number" min="0" step="1" data-id="${esc(p.id)}" data-field="initial" value="${r[p.id]?.initial??0}"></td><td><input aria-label="Final ${esc(p.name)}" type="number" min="0" step="1" data-id="${esc(p.id)}" data-field="final" value="${r[p.id]?.final??0}"></td><td class="num" id="sold-${esc(p.id)}"></td></tr>`).join('')}</tbody></table></div><p class="hint">Hotdog: 2 unidades = 1 plato. Si el número final supera al inicial, aparece una advertencia.</p><div class="total"><span>Venta mínima estimada</span><strong id="total"></strong><small id="warning"></small></div><div class="actions"><button class="secondary" id="export">Exportar copia JSON</button><button class="secondary" id="exportcsv">Exportar jornada CSV</button></div>`;
c.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',e=>{const id=e.target.dataset.id,f=e.target.dataset.field,v=e.target.value;if(v!==''&&(!Number.isInteger(Number(v))||Number(v)<0)){e.target.setCustomValidity('Ingresa un entero no negativo');e.target.reportValidity();return}e.target.setCustomValidity('');ensure()[id]??={initial:0,final:0};ensure()[id][f]=v===''?0:Number(v);save();totals()}));totals();$('#export').onclick=exportJSON;$('#exportcsv').onclick=exportCSV;
}else if(tab==='productos'){c.innerHTML=`<h2>Productos configurados</h2><div class="tablewrap"><table><thead><tr><th>Producto</th><th style="width:145px">Precio base (S/)</th></tr></thead><tbody>${state.products.map(p=>`<tr><td>${esc(p.name)}${p.factor!==1?' <small>(2 und. / plato)</small>':''}</td><td><input type="number" min="0" step="0.01" data-price="${esc(p.id)}" value="${p.price}"></td></tr>`).join('')}</tbody></table></div><div class="panel"><h2>Agregar producto</h2><div class="form"><input id="newname" placeholder="Nombre del producto" maxlength="80"><input id="newprice" type="number" min="0" step="0.01" placeholder="Precio (S/)"><button class="primary" id="add">Agregar</button></div></div><p class="hint">Los precios se aplican también al cálculo de registros anteriores. Para conservar importes históricos fijos, necesitaremos guardar el precio usado en cada jornada en una siguiente versión.</p>`;
c.querySelectorAll('[data-price]').forEach(el=>el.addEventListener('change',e=>{const price=Number(e.target.value);if(e.target.value===''||!Number.isFinite(price)||price<0){alert('Ingresa un precio válido');render();return}const p=state.products.find(x=>x.id===e.target.dataset.price);if(p){p.price=price;save()}}));$('#add').onclick=()=>{let name=$('#newname').value.trim(),price=Number($('#newprice').value);if(!name||$('#newprice').value===''||!Number.isFinite(price)||price<0){alert('Indica nombre y precio válido');return}if(state.products.some(x=>x.name.toLowerCase()===name.toLowerCase())){alert('Ya existe un producto con ese nombre');return}state.products.push({id:'p'+Date.now(),name,price,factor:1});save();render()};
}else{const keys=Object.keys(state.records).sort().reverse();c.innerHTML=`<h2>Historial de jornadas</h2><p class="hint">Jornada de 2:00 a. m. a 2:00 a. m. del día siguiente, según la hora del dispositivo. Consulta de los últimos 3 meses.</p>${keys.length?keys.map(k=>`<div class="historyrow"><div><b>${esc(k)}</b><br><span>${state.products.reduce((n,p)=>n+Math.max(0,count(p,state.records[k][p.id])),0).toLocaleString('es-PE')} equivalentes vendidos</span></div><b>${money(totalFor(state.records[k]))}</b></div>`).join(''):'<div class="empty">Sin jornadas registradas.</div>'}<div class="actions"><button class="secondary" id="export">Exportar copia JSON</button></div>`;$('#export').onclick=exportJSON}}
function totals(){let r=ensure(),invalid=0;state.products.forEach(p=>{let n=count(p,r[p.id]),el=document.getElementById('sold-'+p.id);el.textContent=(Number.isInteger(n)?String(n):n.toFixed(1))+(p.factor===2?' platos':'');el.classList.toggle('negative',n<0);if(n<0)invalid++});$('#total').textContent=money(totalFor(r));$('#warning').textContent=invalid?'Atención: '+invalid+' producto(s) tienen cantidad final mayor que inicial. Verifica las entradas de mercadería.':''}
function download(name,type,data){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('AXIUN_M_respaldo_'+dayKey()+'.json','application/json',JSON.stringify(state,null,2))}
function exportCSV(){const r=ensure();const lines=[['Fecha','Producto','Inicial','Final','Equivalente vendido','Precio base','Importe estimado'],...state.products.map(p=>[dayKey(),p.name,r[p.id]?.initial??0,r[p.id]?.final??0,count(p,r[p.id]),p.price,Math.max(0,count(p,r[p.id]))*p.price])];download('AXIUN_M_'+dayKey()+'.csv','text/csv;charset=utf-8','\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'))}
function prune(){const cutoff=new Date();cutoff.setMonth(cutoff.getMonth()-3);const min=dayKey(cutoff);let changed=false;Object.keys(state.records).forEach(k=>{if(k<min){delete state.records[k];changed=true}});if(changed)save()}
prune();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
})();
</script></body></html>
